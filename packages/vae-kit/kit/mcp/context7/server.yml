# Context7 MCP: up-to-date library docs. CONTEXT7_API_KEY is optional; without
# it the server still runs at a lower rate limit. Get a key at
# https://context7.com/dashboard
serverName: context7
transport: stdio
command: npx
args:
  - -y
  - '@upstash/context7-mcp@latest'
envFrom:
  CONTEXT7_API_KEY: CONTEXT7_API_KEY
