# Personal MCP + Skill catalog. This file declares what exists in the kit.
# It does not start servers. Enablement lives in ~/.dsh/extensions.yml
# (global) and <gitRoot>/.dsh/extensions.yml (project). Same id: project wins.
#
# default:
#   global  — treat as on for every session until a file says otherwise
#   project — off until that repository's extensions.yml turns it on
#   off     — off until a file turns it on

mcp:
  playwright:
    title: Playwright
    description: Browser automation for the current repository.
    default: project
    tags: [browser]

skills:
  officecli:
    title: officecli
    description: Create, inspect, and edit Word, Excel, and PowerPoint files through the officecli CLI.
    default: global
    tags: [office]
